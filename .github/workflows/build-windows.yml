name: Build Windows installer

# Builds the Windows NSIS installer (.exe) on a Windows runner — you can't do
# this reliably from macOS. Runs automatically when a v* tag is pushed, or
# manually via "Run workflow" against an existing tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach the installer to (e.g. v0.1.0)'
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      # Default checkout: a tag push builds that tag; a manual run builds the
      # branch it's dispatched from (main), which is what you want for v0.1.0
      # since the tag predates the Windows build config.
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - run: bun run build

      - name: Package Windows installer
        run: bunx electron-builder --win --config electron-builder.yml

      - name: Attach installer to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: release/Rever-Browser-*-setup.exe
