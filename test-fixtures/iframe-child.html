<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iframe child</title>
<style>
  body{margin:0;padding:10px;background:#101722;color:#e6edf3;
    font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .t{background:#1c2333;border:1px solid #2b3444;border-radius:6px;padding:6px 10px;
     color:#e6edf3;font-size:13px;display:inline-block;margin:2px}
  .ptr{cursor:pointer}
  .tag{color:#9aa7b4;font-size:11px}
</style>
</head>
<body>
<p class="tag">child frame · origin <span id="org"></span></p>
<button class="t" id="k1">K1 native button in frame</button>
<a class="t" href="#k2" id="k2">K2 link in frame</a>
<div class="t ptr" id="k3">K3 pointer div in frame</div>
<script>
  document.getElementById('org').textContent = location.origin
  document.getElementById('k3').addEventListener('click', function () {
    fetch(location.origin + '/api/from-iframe?src=k3').catch(function () {})
  })
  document.getElementById('k1').addEventListener('click', function () {
    fetch(location.origin + '/api/from-iframe?src=k1').catch(function () {})
  })
</script>
</body>
</html>
